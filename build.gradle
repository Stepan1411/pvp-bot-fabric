plugins {
    id 'fabric-loom' version '1.13-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "pvp_bot" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven { url 'https://jitpack.io' } // HeroBot
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    
    // Permissions API (LuckPerms support). Bundled via jar-in-jar.
    include(modImplementation("me.lucko:fabric-permissions-api:0.6.1"))
    
    // HeroBot - required dependency for bot spawning and movement
    // User must install HeroBot separately, we detect it at runtime
    // No compile-time dependency needed since we use reflection
    
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}

task downloadHeroBot {
    def herobotDir = file("run/mods")
    def herobotFile = file("run/mods/herobot-1.21.11-1.4.3+v260315.jar")
    def herobotUrl = "https://cdn.modrinth.com/data/wt23fpWX/versions/9ig2SGA7/herobot-1.21.11-1.4.3%2Bv260315.jar"

    outputs.file herobotFile

    doLast {
        if (!herobotFile.exists()) {
            herobotDir.mkdirs()
            logger.lifecycle("Downloading HeroBot...")
            new URL(herobotUrl).withInputStream { i ->
                herobotFile.withOutputStream { it << i }
            }
            logger.lifecycle("HeroBot downloaded to ${herobotFile}")
        } else {
            logger.lifecycle("HeroBot already present: ${herobotFile}")
        }
    }
}

runClient.dependsOn downloadHeroBot

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            
            groupId = project.maven_group
            artifactId = project.archives_base_name
            version = project.mod_version
        }
    }
    
    repositories {
        // Для локальной публикации
        mavenLocal()
    }
}